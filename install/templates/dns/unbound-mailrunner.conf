# MailRunner node resolver (install.sh): recursive, validating, TTL-based cache shared by
# all analyses. Only reachable from the node itself. Flush: "mailrunner mr:dns:flush".
server:
    interface: 127.0.0.1
    interface: ::1
    access-control: 127.0.0.0/8 allow
    access-control: ::1/128 allow
    do-ip6: yes
    prefetch: yes
    qname-minimisation: yes
    harden-dnssec-stripped: yes
    hide-identity: yes
    hide-version: yes
    msg-cache-size: 64m
    rrset-cache-size: 128m
    serve-expired: no
    val-log-level: 1

# remote-control: Ubuntu's remote-control.conf (unix socket /run/unbound.ctl)
