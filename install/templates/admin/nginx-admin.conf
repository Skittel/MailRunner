# MailRunner Admin GUI (install-admin.sh)
server {
    listen 80;
    listen [::]:80;
    server_name {{HOSTNAME}};
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{HOSTNAME}};

    ssl_certificate     /etc/letsencrypt/live/{{HOSTNAME}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{HOSTNAME}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    root /opt/mailrunner-admin/current/public;
    client_max_body_size 1m;

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.php$is_args$args;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/mailrunner-admin.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
    location ~ /\. {
        deny all;
    }
}
