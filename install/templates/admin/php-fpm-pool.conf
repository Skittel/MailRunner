; MailRunner Admin pool (install-admin.sh)
[mailrunner-admin]
user = mailrunner-admin
group = mailrunner-admin
listen = /run/php/mailrunner-admin.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 30s
php_admin_flag[expose_php] = off
