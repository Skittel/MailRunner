# MailRunner API (install.sh)
server {
    listen 80;
    listen [::]:80;
    server_name {{CERT_NAMES}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name {{HOSTNAME}};

    ssl_certificate     /etc/letsencrypt/live/{{HOSTNAME}}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{{HOSTNAME}}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Admin API (mTLS): client certificates signed by the MailRunner Admin CA (install.sh --admin-ca=...).
    # Optional for the customer API; /admin/ requires a verified certificate.
    include /etc/nginx/snippets/mailrunner-admin-mtls.conf;

    root /opt/mailrunner/current/public;
    client_max_body_size 2m;

    location / {
        try_files $uri /index.php$is_args$args;
    }
    location ^~ /admin/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        include fastcgi_params;
        fastcgi_pass unix:/run/php/mailrunner.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param MR_CLIENT_VERIFY $ssl_client_verify;
        fastcgi_param MR_CLIENT_S_DN $ssl_client_s_dn;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/mailrunner.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param MR_CLIENT_VERIFY "";
    }
    location ~ /\. {
        deny all;
    }
}
