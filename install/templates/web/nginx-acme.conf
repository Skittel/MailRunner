# MailRunner: ACME challenge only (install.sh, until the certificate exists; then replaced by mailrunner-api)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name {{HOSTNAME}};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }
    location / {
        return 404;
    }
}
