openapi: 3.1.0
info:
  title: MailRunner customer API (receive)
  version: 0.1.35
  description: |
    Pull API of a MailRunner node. A client application collects the messages the node accepted
    for its project. A token belongs to exactly one project and only sees that project's data.

    Recommended collection loop (no client-side cursor needed):

    1. `GET /v1/messages?acked=0&include=content&limit=100`
    2. Store every message durably on the client side.
    3. `POST /v1/messages/ack` with the stored `message_id`s.
    4. Repeat while `has_more` is true; otherwise wait (e.g. 30-60 s) and start again.

    Messages that are not acknowledged stay in step 1 until they expire, so a client crash
    between steps 2 and 3 only causes a re-delivery. Deduplicate by `message_id`.

    Human-readable documentation: https://wiki.skit.center/books/mailrunnerpub
  license:
    name: MIT (with attribution clause)
servers:
  - url: https://{node}
    variables:
      node:
        default: node.example.net
        description: Host name of the MailRunner node
security:
  - bearer: []

paths:
  /v1/node/status:
    get:
      summary: Node version and roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      version: { type: string, example: 0.0.14 }
                      roles: { type: array, items: { type: string, enum: [receive, send] } }
                      selftest:
                        type: [object, 'null']
                        description: 'Last node self test (hourly); null if none yet'
                        properties:
                          status: { type: string, enum: [pass, fail, error] }
                          finished_at: { type: [string, 'null'], format: date-time }
                          failed: { type: array, items: { type: string }, example: ['smtp.v4.certificate'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProjectDisabled' }

  /v1/messages:
    get:
      summary: List received messages of the project, oldest first
      parameters:
        - name: acked
          in: query
          description: '0 = only not yet acknowledged, 1 = only acknowledged, omitted = all'
          schema: { type: string, enum: ['0', '1'] }
        - name: after_id
          in: query
          description: Cursor; returns messages after this value (use `next_after_id` of the previous page)
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Page size, 1-1000 (1-100 with include=content)
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: include
          in: query
          description: '`content` adds `record`, `debug` and `raw_headers` to every message'
          schema: { type: string, enum: [content] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, next_after_id, has_more]
                    properties:
                      data:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Message'
                            - $ref: '#/components/schemas/MessageWithContent'
                      next_after_id: { type: integer }
                      has_more: { type: boolean, description: 'true if the page was full; ask again' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProjectDisabled' }

  /v1/messages/{message_id}:
    get:
      summary: One message with content
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessageWithContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/messages/{message_id}/raw:
    get:
      summary: Original message (RFC 5322), only if the project keeps it
      description: Not available for projects with profile `analysis` (the original is deleted right after the analysis).
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The original message
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/messages/ack:
    post:
      summary: Acknowledge collected messages (idempotent)
      description: |
        After acknowledgement the node deletes the content after the project's period
        (default 24 h); metadata is kept longer (default 30 days).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                message_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, example: mrm_9byxavw4d43pw24d }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      acked: { type: array, items: { type: string }, description: 'acknowledged now or before' }
                      unknown: { type: array, items: { type: string }, description: 'not found in this project' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/webhook:
    get:
      summary: Webhook of the project
      description: State of the webhook; data is null if none is set. The URL is shown shortened, with its SHA-256.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Webhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set or replace the webhook (idempotent)
      description: |
        MailRunner sends an empty POST to the URL when new mail of the project is stored and can be fetched
        (header `X-MailRunner-Event: messages`). At most one ping per cooldown: the first mail is announced at once,
        mail arriving during the cooldown gets one more ping when it ends. Timeout 5 s, redirects are not followed,
        pings are never repeated: keep polling (e.g. every 60 s) and make sure a ping and a poll do not fetch at
        the same time. Allowed targets: `https://` on port 443 whose host resolves only to public addresses
        (checked on PUT and again before every ping). Journal: `webhook.updated`, `webhook.deleted`,
        `webhook.sent` and `webhook.failed` (with `http_code` or `error`: `http`, `timeout`, `connect`, `tls`,
        `dns`, `blocked_address`). The webhook belongs to the node: set it on every node the application fetches from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 2048, example: 'https://app.example.com/hooks/mailrunner/<random>' }
                cooldown_seconds: { type: integer, minimum: 1, maximum: 3600, default: 2 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Webhook' }
                      changed: { type: boolean }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: INVALID_WEBHOOK_URL or cooldown out of range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Remove the webhook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      deleted: { type: boolean, description: 'false if none was set' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/smtp-credentials:
    get:
      summary: SMTP credentials of the project (never passwords)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SmtpCredential' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create an SMTP credential
      description: |
        Profile checked_auth only. Mail sent with the login on port 25 (after STARTTLS, or without TLS if
        `plaintext_port25`), 587 (STARTTLS) or 465 (TLS) is stored in the project like MX mail, for any
        sender and recipient (no checks), and fetched with /v1/messages (`received_via: auth`, `auth.username`).
        It is stored even if the analysis fails (`analysis_status: error`) or takes too long. Nothing is relayed.
        Usernames are unique per node (409 USERNAME_EXISTS); a revoked credential frees its username.
        Pass `password` to use the same login on several nodes; without it the node generates one and returns
        it once. A password set by the application is never returned. After 5 failed logins within 10 min a client address is refused for 15 min.
        The credential belongs to the node it was created on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, pattern: '^[a-z0-9][a-z0-9._@+-]{2,99}$', description: 'lower-cased; not starting with mrc_' }
                password: { type: string, minLength: 16, maxLength: 128, description: 'optional; generated if missing' }
                label: { type: string, maxLength: 100 }
                plaintext_port25: { type: boolean, default: false, description: 'allow AUTH without TLS on port 25 (old devices)' }
                allowed_networks: { type: array, items: { type: string, example: 198.51.100.0/24 }, description: 'logins only from these networks' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SmtpCredential' }
                      password: { type: string, description: 'only if generated by the node; shown only now' }
        '409': { description: USERNAME_EXISTS, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'INVALID_USERNAME, INVALID_NETWORK, WEAK_PASSWORD, PROFILE_NO_SMTP_AUTH', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/smtp-credentials/{credential_id}:
    parameters:
      - { name: credential_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Change label, enabled, plaintext_port25 or allowed_networks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                enabled: { type: boolean }
                plaintext_port25: { type: boolean }
                allowed_networks: { type: [array, 'null'], items: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SmtpCredential' } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Revoke the credential at once
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/smtp-credentials/{credential_id}/rotate:
    parameters:
      - { name: credential_id, in: path, required: true, schema: { type: string } }
    post:
      summary: New password (given or generated; a generated one is returned once); the old one stays valid for grace_seconds
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 16, maxLength: 128 }
                grace_seconds: { type: integer, minimum: 0, maximum: 604800, default: 0 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SmtpCredential' }, password: { type: string } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/journal:
    get:
      summary: Events of the project, oldest first
      description: |
        Event types include `receive.received`, `receive.acked`, `receive.deleted`, `receive.expired`,
        configuration changes of the project (`project.updated`, `routes.updated`, `token.created`, ...;
        never secrets) and the delivery attempts:

        - `smtp.attempt`: one SMTP transaction (MAIL FROM ...) with the recipients of this project, their
          answers and the result. A transaction with recipients of several projects yields one event per
          project, each listing only its own recipients and message ids.
        - `receive.role_mail`: a mail to postmaster@ or abuse@ (`message_id`, `role`, `rcpt`, `mail_from`, `raw_kept`,
          `delivery` = project setting default | api | forward, `forwarded`).
        - `smtp.connection`: an SMTP session without MAIL FROM (e.g. scanners, aborted TLS); never
          belongs to a project.

        `node.selftest` (`scope: node`, visible to every project): result of the hourly node self test with
        `status` (pass | fail | error), `version`, `started_at`, `finished_at`, `duration_ms`, `ok`, and
        `failed` / `warnings` as lists of `{name, detail}`.

        Events without a project (`scope: unassigned`) are visible depending on the project setting
        `journal_scope` (set by the operator): `own` = none, `connections` = `smtp.connection`,
        `unassigned` = all `smtp.*` events without a project. Delivery attempts are kept 30 days
        (node setting). If `node_id` changes, start again with `after_id=0`.
      parameters:
        - name: after_id
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: event
          in: query
          description: 'Comma-separated event names, e.g. `smtp.attempt,smtp.connection`'
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            created_at: { type: string, format: date-time }
                            event: { type: string, example: smtp.attempt }
                            scope: { type: string, enum: [project, unassigned, node] }
                            details:
                              oneOf:
                                - $ref: '#/components/schemas/SmtpAttempt'
                                - $ref: '#/components/schemas/SmtpConnection'
                                - { type: [object, 'null'], additionalProperties: true }
                      next_after_id: { type: integer }
                      has_more: { type: boolean }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: '`<token_id>.<secret>`, e.g. `mrt_abcdefghijklmnop.<secret>`. Issued by the node operator.'

  parameters:
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, example: mrm_9byxavw4d43pw24d }

  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked token (code UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProjectDisabled:
      description: Project or customer is disabled (code PROJECT_DISABLED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: Invalid parameters or body (code INVALID_REQUEST)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: MESSAGE_NOT_FOUND, RAW_NOT_AVAILABLE or NOT_FOUND (unknown endpoint)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Envelope:
      type: object
      description: Fields present in every JSON response
      properties:
        node_id: { type: string, example: node1.eu }
        request_id: { type: string, example: 87397291419ab51f }
        time: { type: string, format: date-time }

    SmtpCredential:
      type: object
      properties:
        credential_id: { type: string, example: mrc_7hq2m0pkx4c9wz3a }
        username: { type: string }
        label: { type: string }
        plaintext_port25: { type: boolean }
        allowed_networks: { type: [array, 'null'], items: { type: string } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time, description: 'last mail imported with this login' }
        previous_password_valid_until: { type: [string, 'null'], format: date-time }
    Webhook:
      type: object
      nullable: true
      properties:
        url: { type: string, example: 'https://app.example.com/…x7k2', description: 'host and the last 4 characters only' }
        url_sha256: { type: string }
        cooldown_seconds: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pending: { type: boolean, description: 'new mail waits for the end of the cooldown' }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_status: { type: string, enum: [sent, failed], nullable: true }
        last_http_code: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        last_sent_at: { type: string, format: date-time, nullable: true }
        last_failed_at: { type: string, format: date-time, nullable: true }
    Error:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [error]
          properties:
            error:
              type: object
              properties:
                code: { type: string, example: UNAUTHORIZED }
                message: { type: string }

    Message:
      type: object
      properties:
        message_id: { type: string, example: mrm_9byxavw4d43pw24d, description: 'unique per node; one message per accepted recipient' }
        profile: { type: string, enum: [analysis, checked, checked_auth] }
        role:
          type: [string, 'null']
          enum: [postmaster, abuse, null]
          description: 'Mail to postmaster@/abuse@ (accepted for every project domain; the original is always kept, see /raw)'
        status: { type: string, enum: [analyzed, pending] }
        received_at: { type: string, format: date-time }
        received_via: { type: string, enum: [mx, auth], description: 'auth = delivered with an SMTP credential of the project (no recipient check)' }
        auth:
          type: [object, 'null']
          properties:
            credential_id: { type: string, example: mrc_7hq2m0pkx4c9wz3a }
            username: { type: string, description: 'login used for SMTP AUTH' }
            service: { type: string, enum: [smtp, submission, smtps], description: 'port 25, 587 or 465' }
        envelope:
          type: object
          properties:
            mail_from: { type: string, description: 'SMTP MAIL FROM (empty for bounces)' }
            rcpt: { type: string, description: 'SMTP RCPT TO' }
            client_ip: { type: string, example: 192.0.2.10 }
            helo: { type: string }
            queue_id: { type: string }
            client:
              type: object
              description: 'IP information of the sending server (null values if the node does not use ipregistry)'
              properties:
                asn: { type: [integer, 'null'], example: 64500 }
                as_organization: { type: [string, 'null'] }
                country: { type: [string, 'null'], description: 'ISO 3166-1 alpha-2', example: DE }
                city: { type: [string, 'null'] }
                continent: { type: [string, 'null'], example: EU }
                carrier: { type: [string, 'null'], description: 'mobile carrier, null for non-mobile networks' }
                is_threat: { type: [boolean, 'null'] }
        header:
          type: object
          properties:
            from: { type: [string, 'null'] }
            to: { type: [string, 'null'] }
            subject: { type: [string, 'null'] }
            date: { type: [string, 'null'] }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              size: { type: integer }
              content_type: { type: string }
              disposition: { type: string }
        spf_status: { type: [string, 'null'], example: pass }
        dkim_status: { type: [string, 'null'], example: pass }
        analysis_status: { type: [string, 'null'], enum: [ok, timeout, null] }
        analysis_ms: { type: [integer, 'null'] }
        raw_available: { type: boolean }
        size: { type: integer, description: bytes }
        sha256: { type: string, description: 'of the original message' }
        acked_at: { type: [string, 'null'], format: date-time }
        content_deleted_at: { type: [string, 'null'], format: date-time }
        delete_reason: { type: [string, 'null'], enum: [ack_retention, expired, null] }

    MessageWithContent:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          description: 'Content fields are null once content_deleted_at is set.'
          properties:
            record:
              type: [object, 'null']
              description: 'Header data: queue_id, smtp_mail_from, smtp_rcpt_to, header_from, header_to, subject, date_hdr, spf_status, dkim_status, mail_id, created'
              additionalProperties: true
            debug:
              type: [object, 'null']
              description: |
                Full analysis: smtp (incl. TLS), spf, dkim, dmarc, arc, return_path, fcrdns, helo,
                ip protocol, dnsbl, domain security, dns analysis, smime; depending on the node also
                blacklistmaster and ipregistry. Results taken from the node cache carry `cached` and `cached_at`.
              additionalProperties: true
            raw_headers: { type: [string, 'null'], description: 'all header lines as received' }

    SmtpSession:
      type: object
      properties:
        session_id: { type: string, example: mrs_c9475f35fbb2d47c03c9 }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: [integer, 'null'], description: 'connect to disconnect' }
        client:
          type: object
          properties:
            ip: { type: string, example: 192.0.2.10 }
            port: { type: [integer, 'null'] }
            name: { type: string, description: 'reverse DNS name as checked by Postfix, "unknown" if none' }
        helo: { type: [string, 'null'], description: 'last HELO/EHLO name' }
        tls:
          type: [object, 'null']
          properties:
            protocol: { type: string, example: TLSv1.3 }
            cipher: { type: string }
        end: { type: string, description: '"disconnect", "lost connection after DATA", "timeout after RCPT", "incomplete" ...' }

    SmtpConnection:
      allOf:
        - $ref: '#/components/schemas/SmtpSession'
        - type: object
          properties:
            tls_ms: { type: [integer, 'null'], description: 'ms after connect until TLS was established' }
            commands: { type: [string, 'null'], description: 'Postfix command statistics, e.g. "ehlo=1 starttls=1 commands=2"' }
            warnings: { type: array, items: { type: string }, example: ['non-SMTP command'] }

    SmtpAttempt:
      allOf:
        - $ref: '#/components/schemas/SmtpSession'
        - type: object
          properties:
            attempt: { type: integer, description: 'number of the transaction within the session' }
            mail_from: { type: [string, 'null'], description: 'empty string for bounces, null if unknown' }
            queue_id: { type: [string, 'null'] }
            recipients:
              type: array
              items:
                type: object
                properties:
                  rcpt: { type: string }
                  status: { type: string, enum: [accepted, rejected, tempfail] }
                  reply: { type: [string, 'null'], example: '550 5.1.1 <x@example.org>: Recipient address rejected: User unknown' }
            result:
              type: object
              properties:
                status: { type: string, enum: [accepted, rejected, tempfail, aborted, none], description: 'accepted = stored (250); none = no data for these recipients' }
                reply: { type: [string, 'null'] }
            message_ids: { type: array, items: { type: string }, description: 'messages of this project created by the attempt' }
            timing:
              type: [object, 'null']
              description: 'ms after connect (null if the step did not happen); wait_ms = reply_ms - data_end_ms'
              properties:
                tls_ms: { type: [integer, 'null'] }
                mail_from_ms: { type: [integer, 'null'] }
