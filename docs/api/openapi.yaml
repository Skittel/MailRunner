openapi: 3.1.0
info:
  title: MailRunner customer API (receive, send)
  version: 0.2.2
  description: |
    Pull API of a MailRunner node. A client application collects the messages the node accepted
    for its project. A token belongs to exactly one project and only sees that project's data.

    Recommended collection loop (no client-side cursor needed):

    1. `GET /v1/messages?acked=0&include=content&limit=100`
    2. Store every message durably on the client side.
    3. `POST /v1/messages/ack` with the stored `message_id`s.
    4. Repeat while `has_more` is true; otherwise wait (e.g. 30-60 s) and start again.

    Messages that are not acknowledged stay in step 1 until they expire, so a client crash
    between steps 2 and 3 only causes a re-delivery. Deduplicate by `message_id`.

    Send projects (type `send`, decision E-27, being built from 0.2.0): `/v1/domains` and `/v1/dkim/generate`.
    A token of a receive project gets 409 PROJECT_TYPE there; the send endpoints exist only on nodes with the
    send role.

    Human-readable documentation: https://wiki.skit.center/books/mailrunnerpub
  license:
    name: MIT (with attribution clause)
servers:
  - url: https://{node}
    variables:
      node:
        default: node.example.net
        description: Host name of the MailRunner node
security:
  - bearer: []

paths:
  /v1/node/status:
    get:
      summary: Node version and roles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      version: { type: string, example: 0.0.14 }
                      roles: { type: array, items: { type: string, enum: [receive, send] } }
                      selftest:
                        type: [object, 'null']
                        description: 'Last node self test (hourly); null if none yet'
                        properties:
                          status: { type: string, enum: [pass, fail, error] }
                          finished_at: { type: [string, 'null'], format: date-time }
                          failed: { type: array, items: { type: string }, example: ['smtp.v4.certificate'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProjectDisabled' }

  /v1/messages:
    get:
      summary: List received messages of the project, oldest first
      parameters:
        - name: acked
          in: query
          description: '0 = only not yet acknowledged, 1 = only acknowledged, omitted = all'
          schema: { type: string, enum: ['0', '1'] }
        - name: after_id
          in: query
          description: Cursor; returns messages after this value (use `next_after_id` of the previous page)
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Page size, 1-1000 (1-100 with include=content)
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: include
          in: query
          description: '`content` adds `record`, `debug` and `raw_headers` to every message'
          schema: { type: string, enum: [content] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    required: [data, next_after_id, has_more]
                    properties:
                      data:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/Message'
                            - $ref: '#/components/schemas/MessageWithContent'
                      next_after_id: { type: integer }
                      has_more: { type: boolean, description: 'true if the page was full; ask again' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/ProjectDisabled' }

  /v1/messages/{message_id}:
    get:
      summary: One message with content
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MessageWithContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/messages/{message_id}/raw:
    get:
      summary: Original message (RFC 5322), only if the project keeps it
      description: Not available for projects with profile `analysis` (the original is deleted right after the analysis).
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          description: The original message
          content:
            message/rfc822:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/messages/ack:
    post:
      summary: Acknowledge collected messages (idempotent)
      description: |
        After acknowledgement the node deletes the content after the project's period
        (default 24 h); metadata is kept longer (default 30 days).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_ids]
              properties:
                message_ids:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: string, example: mrm_9byxavw4d43pw24d }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      acked: { type: array, items: { type: string }, description: 'acknowledged now or before' }
                      unknown: { type: array, items: { type: string }, description: 'not found in this project' }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/webhook:
    get:
      summary: Webhook of the project
      description: State of the webhook; data is null if none is set. The URL is shown shortened, with its SHA-256.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Webhook' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      summary: Set or replace the webhook (idempotent)
      description: |
        MailRunner sends an empty POST to the URL when new mail of the project is stored and can be fetched
        (header `X-MailRunner-Event: messages`). At most one ping per cooldown: the first mail is announced at once,
        mail arriving during the cooldown gets one more ping when it ends. Timeout 5 s, redirects are not followed,
        pings are never repeated: keep polling (e.g. every 60 s) and make sure a ping and a poll do not fetch at
        the same time. Allowed targets: `https://` on port 443 whose host resolves only to public addresses
        (checked on PUT and again before every ping). Journal: `webhook.updated`, `webhook.deleted`,
        `webhook.sent` and `webhook.failed` (with `http_code` or `error`: `http`, `timeout`, `connect`, `tls`,
        `dns`, `blocked_address`). The webhook belongs to the node: set it on every node the application fetches from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, maxLength: 2048, example: 'https://app.example.com/hooks/mailrunner/<random>' }
                cooldown_seconds: { type: integer, minimum: 1, maximum: 3600, default: 2 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Webhook' }
                      changed: { type: boolean }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422':
          description: INVALID_WEBHOOK_URL or cooldown out of range
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: Remove the webhook
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      deleted: { type: boolean, description: 'false if none was set' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/smtp-credentials:
    get:
      summary: SMTP credentials of the project (never passwords)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SmtpCredential' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      summary: Create an SMTP credential
      description: |
        Profile checked_auth only. Mail sent with the login on port 25 (after STARTTLS, or without TLS if
        `plaintext_port25`), 587 (STARTTLS) or 465 (TLS) is stored in the project like MX mail, for any
        sender and recipient (no checks), and fetched with /v1/messages (`received_via: auth`, `auth.username`).
        It is stored even if the analysis fails (`analysis_status: error`) or takes too long. Nothing is relayed.
        Usernames are unique per node (409 USERNAME_EXISTS); a revoked credential frees its username.
        Pass `password` to use the same login on several nodes; without it the node generates one and returns
        it once. A password set by the application is never returned. After 5 failed logins within 10 min a client address is refused for 15 min.
        The credential belongs to the node it was created on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string, pattern: '^[a-z0-9][a-z0-9._@+-]{2,99}$', description: 'lower-cased; not starting with mrc_' }
                password: { type: string, minLength: 16, maxLength: 128, description: 'optional; generated if missing' }
                label: { type: string, maxLength: 100 }
                plaintext_port25: { type: boolean, default: false, description: 'allow AUTH without TLS on port 25 (old devices)' }
                allowed_networks: { type: array, items: { type: string, example: 198.51.100.0/24 }, description: 'logins only from these networks' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SmtpCredential' }
                      password: { type: string, description: 'only if generated by the node; shown only now' }
        '409': { description: USERNAME_EXISTS, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'INVALID_USERNAME, INVALID_NETWORK, WEAK_PASSWORD, PROFILE_NO_SMTP_AUTH', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/smtp-credentials/{credential_id}:
    parameters:
      - { name: credential_id, in: path, required: true, schema: { type: string } }
    patch:
      summary: Change label, enabled, plaintext_port25 or allowed_networks
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                enabled: { type: boolean }
                plaintext_port25: { type: boolean }
                allowed_networks: { type: [array, 'null'], items: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SmtpCredential' } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Revoke the credential at once
      responses:
        '200': { description: OK }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/smtp-credentials/{credential_id}/rotate:
    parameters:
      - { name: credential_id, in: path, required: true, schema: { type: string } }
    post:
      summary: New password (given or generated; a generated one is returned once); the old one stays valid for grace_seconds
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, minLength: 16, maxLength: 128 }
                grace_seconds: { type: integer, minimum: 0, maximum: 604800, default: 0 }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SmtpCredential' }, password: { type: string } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/domains:
    get:
      summary: Sender domains of the send project with their DKIM selector and the DNS record to publish
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SendDomain' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/ProjectType' }
  /v1/domains/{domain}:
    parameters:
      - { name: domain, in: path, required: true, schema: { type: string, example: shop.example } }
    get:
      summary: One sender domain
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SendDomain' } } } ] } } } }
        '404': { description: DOMAIN_NOT_FOUND, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/ProjectType' }
    put:
      summary: Set or replace the DKIM key of a domain (idempotent)
      description: |
        Without a domain entry with a valid DKIM key nothing is sent from that domain. The domain must be allowed
        for the project (set by the node operator; subdomains of an allowed domain are included). The private key
        is stored encrypted on the node and never returned. Use the same key on every node of the project.
        RSA: unencrypted PEM, 1024-4096 bit (2048 recommended). ed25519 (RFC 8463): base64 of the 32-byte seed.
        Setting the same selector and key again returns `changed: false`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [selector, private_key]
              properties:
                selector: { type: string, maxLength: 63, pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)*$', example: mr2611-k3a9 }
                private_key: { type: string, description: 'RSA PEM or ed25519 base64 seed' }
                algorithm: { type: string, enum: [rsa, ed25519], description: 'optional; derived from the key (PEM = rsa)' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SendDomain' }, changed: { type: boolean } } } ] } } } }
        '403': { description: DOMAIN_NOT_ALLOWED, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/ProjectType' }
        '422': { description: 'INVALID_DOMAIN, INVALID_DKIM_SELECTOR, INVALID_DKIM_KEY, TOO_MANY_DOMAINS', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Remove the domain and its key
      responses:
        '200': { description: 'OK, `deleted: false` if it did not exist' }
        '409': { $ref: '#/components/responses/ProjectType' }
  /v1/dkim/generate:
    post:
      summary: Generate a DKIM key pair (stores nothing)
      description: |
        Returns a new private key, a selector and the TXT record to publish. Nothing is stored: keep the key in
        your application and set it with `PUT /v1/domains/{domain}` (on every node of the project). A TXT string
        holds at most 255 characters; `value_parts` is the value split accordingly for zone files and DNS panels.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string, example: shop.example }
                algorithm: { type: string, enum: [rsa, ed25519], default: rsa }
                bits: { type: integer, enum: [2048, 3072, 4096], default: 2048, description: 'rsa only' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          domain: { type: string }
                          selector: { type: string, example: mr2611-k3a9 }
                          algorithm: { type: string, enum: [rsa, ed25519] }
                          bits: { type: integer }
                          private_key: { type: string, description: 'shown only now' }
                          dns: { $ref: '#/components/schemas/DkimDnsRecord' }
        '409': { $ref: '#/components/responses/ProjectType' }
        '422': { description: 'INVALID_DOMAIN, INVALID_DKIM_KEY (unknown algorithm or bits)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/send:
    post:
      summary: Submit a mail for sending
      description: |
        Needs the token of an `api` access of a send profile (a project token gets `403 SEND_ACCESS_REQUIRED`).
        Either a structured message or a raw message (`raw`, base64; recipients from `recipients` or from To, Cc and
        Bcc). The node checks the profile (senders: envelope and From, exact address or exact domain; recipients),
        the project (sender domain allowed and set up with a DKIM key) and the limits (per recipient, rolling 60
        minutes and 24 hours, profile and project). An accepted mail gets one message per recipient (`queued`) and is
        stored encrypted; a Bcc header is never kept, Date and Message-ID are added when missing.
        SMTP: the same checks for smtp and ip accesses; refusals as 550 (rules) or 451 (limits, temporary problems).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [from, subject]
                  properties:
                    from: { type: string, example: 'Shop <info@shop.example>' }
                    to: { oneOf: [ { type: string }, { type: array, items: { type: string } } ] }
                    cc: { oneOf: [ { type: string }, { type: array, items: { type: string } } ] }
                    bcc: { oneOf: [ { type: string }, { type: array, items: { type: string } } ] }
                    reply_to: { type: string }
                    subject: { type: string, maxLength: 998 }
                    text: { type: string }
                    html: { type: string }
                    headers: { type: object, additionalProperties: { type: string }, description: 'custom headers; From, To, Subject, Date, Message-ID, Content-* and similar are reserved' }
                    attachments:
                      type: array
                      maxItems: 50
                      items:
                        type: object
                        required: [filename, content]
                        properties:
                          filename: { type: string }
                          content_type: { type: string, default: application/octet-stream }
                          content: { type: string, description: base64 }
                          inline: { type: boolean, default: false, description: 'part of the HTML (multipart/related), needs content_id' }
                          content_id: { type: string }
                - type: object
                  required: [raw]
                  properties:
                    raw: { type: string, description: 'complete message (RFC 5322) as base64, at most 20 MB' }
                    recipients: { type: array, items: { type: string }, description: 'envelope recipients; default: To, Cc and Bcc of the message' }
      responses:
        '202':
          description: Accepted and queued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          submission_id: { type: string, example: mrs_k3f9x2m7q1w8e4r6 }
                          messages: { type: array, items: { type: object, properties: { message_id: { type: string }, recipient: { type: string }, status: { type: string } } } }
        '403': { description: 'SEND_ACCESS_REQUIRED, ACCESS_DISABLED, PROJECT_DISABLED', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '413': { description: MESSAGE_TOO_LARGE, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'SENDER_NOT_ALLOWED, DKIM_MISSING, INVALID_FROM, INVALID_RECIPIENT, RECIPIENT_NOT_ALLOWED, INVALID_MESSAGE, INVALID_REQUEST', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '429': { description: 'LIMIT_REACHED (profile or project)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/send/submissions/{submission_id}:
    parameters:
      - { name: submission_id, in: path, required: true, schema: { type: string } }
    get:
      summary: A submission with its messages
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/SendSubmission' }, { type: object, properties: { messages: { type: array, items: { $ref: '#/components/schemas/SendMessage' } } } } ] } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/send/messages/{message_id}:
    parameters:
      - { name: message_id, in: path, required: true, schema: { type: string } }
    get:
      summary: One message (one recipient) with its submission
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { allOf: [ { $ref: '#/components/schemas/SendMessage' }, { type: object, properties: { submission: { $ref: '#/components/schemas/SendSubmission' } } } ] } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/send-profiles:
    get:
      summary: Send profiles of the project
      description: Send projects only. Every profile with its access counts and the limits that apply after the project limits.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { type: array, items: { $ref: '#/components/schemas/SendProfile' } }
        '409': { $ref: '#/components/responses/ProjectType' }
  /v1/send-profiles/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,62}$' } }
    get:
      summary: One send profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SendProfile' } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      summary: Create or replace a send profile (idempotent)
      description: |
        The complete definition; omitted optional fields get their defaults. The same definition again changes
        nothing (`changed: false`). Senders must be allowed for the project and the limits must not exceed the
        project limits; a project without limits (set in MailRunner Admin) cannot have profiles.
        Retries: `"default"` = 16 attempts within 480 minutes. The node plans them itself: the first retry after
        one minute, the gaps grow by a fixed factor, the last attempt is at `max_minutes` (`schedule_minutes`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senders, limit_hour, limit_day]
              properties:
                senders: { type: array, items: { type: string }, minItems: 1, maxItems: 100, description: 'domains (subdomains not included) or addresses', example: [shop.example, info@news.shop.example] }
                recipients: { type: array, nullable: true, items: { type: string }, maxItems: 100, description: 'allowed recipient domains or addresses; null = all' }
                limit_hour: { type: integer, minimum: 1 }
                limit_day: { type: integer, minimum: 1 }
                retry:
                  oneOf:
                    - { type: string, enum: [default] }
                    - { type: object, required: [attempts, max_minutes], properties: { attempts: { type: integer, minimum: 5, maximum: 32 }, max_minutes: { type: integer, minimum: 10, maximum: 2880 } } }
                return_path_domain: { type: string, nullable: true, description: 'bounce domain (used from the bounce step on)' }
                test_interval_hours: { type: integer, minimum: 1, maximum: 168, default: 24 }
                label: { type: string, maxLength: 100 }
                enabled: { type: boolean, default: true }
      responses:
        '200': { description: 'Replaced or unchanged (see changed)', content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SendProfile' }, changed: { type: boolean } } } ] } } } }
        '201': { description: Created }
        '403': { description: 'DOMAIN_NOT_ALLOWED, LIMIT_EXCEEDS_PROJECT, PROJECT_LIMIT_MISSING', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/ProjectType' }
        '422': { description: 'INVALID_PROFILE, INVALID_PROFILE_NAME, TOO_MANY_PROFILES', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      summary: Delete a send profile and revoke all its accesses
      responses:
        '200': { description: 'deleted: false if it did not exist', content: { application/json: { schema: { type: object, properties: { deleted: { type: boolean } } } } } }
  /v1/send-profiles/{name}/accesses:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      summary: Accesses of a send profile
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/SendAccess' } } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      summary: Add an access (api, smtp or ip)
      description: |
        `api`: a token that can only submit mail (and read `/v1/node/status`), returned once as `bearer`.
        `smtp`: a login for ports 25/587/465; the username is unique on the node across send and receive logins.
        A generated password is returned once; a password set by the application is never returned.
        `ip`: client networks that may relay without login, IPv4 up to /29 and IPv6 up to /64, public or private
        unicast, never overlapping an ip access of any project on the node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [api, smtp, ip] }
                label: { type: string, maxLength: 100 }
                expires_in: { type: integer, minimum: 60, nullable: true, description: 'api: seconds' }
                username: { type: string, description: 'smtp' }
                password: { type: string, minLength: 16, maxLength: 128, description: 'smtp: optional, otherwise generated' }
                plaintext_port25: { type: boolean, default: false, description: 'smtp: allow AUTH without TLS on port 25' }
                allowed_networks: { type: array, items: { type: string }, nullable: true, description: 'smtp: login only from these networks' }
                networks: { type: array, items: { type: string }, minItems: 1, maxItems: 16, description: 'ip', example: ['203.0.113.8/29', '2001:db8:1::/64'] }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SendAccess' }
                      bearer: { type: string, description: 'api: shown only now' }
                      password: { type: string, description: 'smtp with generated password: shown only now' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'USERNAME_EXISTS, NETWORK_IN_USE, PROJECT_TYPE', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'INVALID_ACCESS, INVALID_NETWORK, INVALID_USERNAME, WEAK_PASSWORD, TOO_MANY_ACCESSES', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/send-accesses/{access_id}:
    parameters:
      - { name: access_id, in: path, required: true, schema: { type: string, example: mra_7hq2m0x4k9d3a1b5 } }
    patch:
      summary: Change an access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string }
                enabled: { type: boolean }
                networks: { type: array, items: { type: string }, description: 'ip only' }
                plaintext_port25: { type: boolean, description: 'smtp only' }
                allowed_networks: { type: array, items: { type: string }, nullable: true, description: 'smtp only' }
      responses:
        '200': { description: OK, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Envelope' }, { type: object, properties: { data: { $ref: '#/components/schemas/SendAccess' } } } ] } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Revoke an access at once (token or login stops working)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { revoked: { type: string } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/send-accesses/{access_id}/rotate:
    parameters:
      - { name: access_id, in: path, required: true, schema: { type: string } }
    post:
      summary: New secret for an api or smtp access
      description: 'api: a new token; the old one stays valid for grace_seconds. smtp: a new password (generated unless given); the old one stays valid for grace_seconds.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                grace_seconds: { type: integer, minimum: 0, maximum: 604800, default: 0 }
                password: { type: string, description: 'smtp only' }
      responses:
        '200': { description: 'bearer (api) or password (smtp, generated) shown only now' }
        '422': { description: 'INVALID_ACCESS (ip accesses have no secret)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /v1/journal:
    get:
      summary: Events of the project, oldest first
      description: |
        Event types include `receive.received`, `receive.acked`, `receive.deleted`, `receive.expired`,
        configuration changes of the project (`project.updated`, `routes.updated`, `token.created`, ...;
        never secrets) and the delivery attempts:

        - `smtp.attempt`: one SMTP transaction (MAIL FROM ...) with the recipients of this project, their
          answers and the result. A transaction with recipients of several projects yields one event per
          project, each listing only its own recipients and message ids.
        - `receive.role_mail`: a mail to postmaster@ or abuse@ (`message_id`, `role`, `rcpt`, `mail_from`, `raw_kept`,
          `delivery` = project setting default | api | forward, `forwarded`).
        - `smtp.connection`: an SMTP session without MAIL FROM (e.g. scanners, aborted TLS); never
          belongs to a project.

        `node.selftest` (`scope: node`, visible to every project): result of the hourly node self test with
        `status` (pass | fail | error), `version`, `started_at`, `finished_at`, `duration_ms`, `ok`, and
        `failed` / `warnings` as lists of `{name, detail}`.

        Events without a project (`scope: unassigned`) are visible depending on the project setting
        `journal_scope` (set by the operator): `own` = none, `connections` = `smtp.connection`,
        `unassigned` = all `smtp.*` events without a project. Delivery attempts are kept 30 days
        (node setting). If `node_id` changes, start again with `after_id=0`.
      parameters:
        - name: after_id
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        - name: event
          in: query
          description: 'Comma-separated event names, e.g. `smtp.attempt,smtp.connection`'
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            id: { type: integer }
                            created_at: { type: string, format: date-time }
                            event: { type: string, example: smtp.attempt }
                            scope: { type: string, enum: [project, unassigned, node] }
                            details:
                              oneOf:
                                - $ref: '#/components/schemas/SmtpAttempt'
                                - $ref: '#/components/schemas/SmtpConnection'
                                - { type: [object, 'null'], additionalProperties: true }
                      next_after_id: { type: integer }
                      has_more: { type: boolean }
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: '`<token_id>.<secret>`, e.g. `mrt_abcdefghijklmnop.<secret>`. Issued by the node operator.'

  parameters:
    MessageId:
      name: message_id
      in: path
      required: true
      schema: { type: string, example: mrm_9byxavw4d43pw24d }

  responses:
    Unauthorized:
      description: Missing, invalid, expired or revoked token (code UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProjectDisabled:
      description: Project or customer is disabled (code PROJECT_DISABLED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidRequest:
      description: Invalid parameters or body (code INVALID_REQUEST)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ProjectType:
      description: The token's project is a receive project; send endpoints need a project of type send (code PROJECT_TYPE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: MESSAGE_NOT_FOUND, RAW_NOT_AVAILABLE or NOT_FOUND (unknown endpoint)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Envelope:
      type: object
      description: Fields present in every JSON response
      properties:
        node_id: { type: string, example: node1.eu }
        request_id: { type: string, example: 87397291419ab51f }
        time: { type: string, format: date-time }

    SmtpCredential:
      type: object
      properties:
        credential_id: { type: string, example: mrc_7hq2m0pkx4c9wz3a }
        username: { type: string }
        label: { type: string }
        plaintext_port25: { type: boolean }
        allowed_networks: { type: [array, 'null'], items: { type: string } }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time, description: 'last mail imported with this login' }
        previous_password_valid_until: { type: [string, 'null'], format: date-time }
    DkimDnsRecord:
      type: object
      properties:
        name: { type: string, example: mr2611-k3a9._domainkey.shop.example }
        type: { type: string, enum: [TXT] }
        value: { type: string, example: 'v=DKIM1; k=rsa; p=MIIBIjANBgkqh...' }
        value_parts: { type: array, items: { type: string, maxLength: 255 } }
    SendDomain:
      type: object
      properties:
        domain: { type: string }
        dkim:
          type: object
          properties:
            selector: { type: string }
            algorithm: { type: string, enum: [rsa, ed25519] }
            bits: { type: integer }
            key_sha256: { type: string, description: 'SHA-256 of the public key; compare it across nodes' }
        dns: { $ref: '#/components/schemas/DkimDnsRecord' }
        allowed: { type: [boolean, 'null'], description: 'false if the operator no longer allows the domain for the project' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SendSubmission:
      type: object
      properties:
        submission_id: { type: string }
        profile: { type: string }
        access_id: { type: string }
        via: { type: string, enum: [api, smtp] }
        smtp_service: { type: string, nullable: true }
        envelope_from: { type: string }
        from: { type: string }
        subject: { type: string, nullable: true }
        message_id_header: { type: string }
        recipients: { type: integer }
        size: { type: integer }
        created_at: { type: string, format: date-time }
    SendMessage:
      type: object
      properties:
        message_id: { type: string, example: mrm_7hq2m0x4k9d3a1b5 }
        recipient: { type: string }
        status: { type: string, enum: [queued, waiting_test, sending, deferred, sent, bounced, failed] }
        status_reason: { type: string, nullable: true }
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SendProfile:
      type: object
      properties:
        profile_id: { type: string, example: mrp_k3f9x2m7q1w8e4r6 }
        name: { type: string }
        label: { type: string }
        enabled: { type: boolean }
        senders: { type: array, items: { type: string } }
        recipients: { type: array, nullable: true, items: { type: string } }
        limit_hour: { type: integer }
        limit_day: { type: integer }
        effective_limit_hour: { type: integer, description: 'lower of profile and project limit' }
        effective_limit_day: { type: integer }
        senders_not_allowed: { type: array, items: { type: string }, description: 'senders the project no longer allows (nothing is sent from them)' }
        retry:
          type: object
          properties:
            attempts: { type: integer }
            max_minutes: { type: integer }
            schedule_minutes: { type: array, items: { type: number }, description: 'retry times after the first attempt' }
        return_path_domain: { type: string, nullable: true }
        test_interval_hours: { type: integer }
        accesses: { type: object, properties: { api: { type: integer }, smtp: { type: integer }, ip: { type: integer } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SendAccess:
      type: object
      properties:
        access_id: { type: string, example: mra_7hq2m0x4k9d3a1b5 }
        profile: { type: string }
        type: { type: string, enum: [api, smtp, ip] }
        label: { type: string }
        enabled: { type: boolean }
        token_id: { type: string, description: api }
        expires_at: { type: string, format: date-time, nullable: true, description: api }
        previous_token_valid_until: { type: string, format: date-time, nullable: true, description: 'api, during a rotation' }
        username: { type: string, description: smtp }
        plaintext_port25: { type: boolean, description: smtp }
        allowed_networks: { type: array, nullable: true, items: { type: string }, description: smtp }
        previous_password_valid_until: { type: string, format: date-time, nullable: true, description: 'smtp, during a rotation' }
        last_used_at: { type: string, format: date-time, nullable: true, description: 'api, smtp' }
        networks: { type: array, items: { type: string }, description: ip }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Webhook:
      type: object
      nullable: true
      properties:
        url: { type: string, example: 'https://app.example.com/…x7k2', description: 'host and the last 4 characters only' }
        url_sha256: { type: string }
        cooldown_seconds: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        pending: { type: boolean, description: 'new mail waits for the end of the cooldown' }
        last_attempt_at: { type: string, format: date-time, nullable: true }
        last_status: { type: string, enum: [sent, failed], nullable: true }
        last_http_code: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        last_sent_at: { type: string, format: date-time, nullable: true }
        last_failed_at: { type: string, format: date-time, nullable: true }
    Error:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          required: [error]
          properties:
            error:
              type: object
              properties:
                code: { type: string, example: UNAUTHORIZED }
                message: { type: string }

    Message:
      type: object
      properties:
        message_id: { type: string, example: mrm_9byxavw4d43pw24d, description: 'unique per node; one message per accepted recipient' }
        profile: { type: string, enum: [analysis, checked, checked_auth] }
        role:
          type: [string, 'null']
          enum: [postmaster, abuse, null]
          description: 'Mail to postmaster@/abuse@ (accepted for every project domain; the original is always kept, see /raw)'
        status: { type: string, enum: [analyzed, pending] }
        received_at: { type: string, format: date-time }
        received_via: { type: string, enum: [mx, auth], description: 'auth = delivered with an SMTP credential of the project (no recipient check)' }
        auth:
          type: [object, 'null']
          properties:
            credential_id: { type: string, example: mrc_7hq2m0pkx4c9wz3a }
            username: { type: string, description: 'login used for SMTP AUTH' }
            service: { type: string, enum: [smtp, submission, smtps], description: 'port 25, 587 or 465' }
        envelope:
          type: object
          properties:
            mail_from: { type: string, description: 'SMTP MAIL FROM (empty for bounces)' }
            rcpt: { type: string, description: 'SMTP RCPT TO' }
            client_ip: { type: string, example: 192.0.2.10 }
            helo: { type: string }
            queue_id: { type: string }
            client:
              type: object
              description: 'IP information of the sending server (null values if the node does not use ipregistry)'
              properties:
                asn: { type: [integer, 'null'], example: 64500 }
                as_organization: { type: [string, 'null'] }
                country: { type: [string, 'null'], description: 'ISO 3166-1 alpha-2', example: DE }
                city: { type: [string, 'null'] }
                continent: { type: [string, 'null'], example: EU }
                carrier: { type: [string, 'null'], description: 'mobile carrier, null for non-mobile networks' }
                is_threat: { type: [boolean, 'null'] }
        header:
          type: object
          properties:
            from: { type: [string, 'null'] }
            to: { type: [string, 'null'] }
            subject: { type: [string, 'null'] }
            date: { type: [string, 'null'] }
        attachments:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              size: { type: integer }
              content_type: { type: string }
              disposition: { type: string }
        spf_status: { type: [string, 'null'], example: pass }
        dkim_status: { type: [string, 'null'], example: pass }
        analysis_status: { type: [string, 'null'], enum: [ok, timeout, null] }
        analysis_ms: { type: [integer, 'null'] }
        raw_available: { type: boolean }
        size: { type: integer, description: bytes }
        sha256: { type: string, description: 'of the original message' }
        acked_at: { type: [string, 'null'], format: date-time }
        content_deleted_at: { type: [string, 'null'], format: date-time }
        delete_reason: { type: [string, 'null'], enum: [ack_retention, expired, null] }

    MessageWithContent:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          description: 'Content fields are null once content_deleted_at is set.'
          properties:
            record:
              type: [object, 'null']
              description: 'Header data: queue_id, smtp_mail_from, smtp_rcpt_to, header_from, header_to, subject, date_hdr, spf_status, dkim_status, mail_id, created'
              additionalProperties: true
            debug:
              type: [object, 'null']
              description: |
                Full analysis: smtp (incl. TLS), spf, dkim, dmarc, arc, return_path, fcrdns, helo,
                ip protocol, dnsbl, domain security, dns analysis, smime; depending on the node also
                blacklistmaster and ipregistry. Results taken from the node cache carry `cached` and `cached_at`.
              additionalProperties: true
            raw_headers: { type: [string, 'null'], description: 'all header lines as received' }

    SmtpSession:
      type: object
      properties:
        session_id: { type: string, example: mrs_c9475f35fbb2d47c03c9 }
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        duration_ms: { type: [integer, 'null'], description: 'connect to disconnect' }
        client:
          type: object
          properties:
            ip: { type: string, example: 192.0.2.10 }
            port: { type: [integer, 'null'] }
            name: { type: string, description: 'reverse DNS name as checked by Postfix, "unknown" if none' }
        helo: { type: [string, 'null'], description: 'last HELO/EHLO name' }
        tls:
          type: [object, 'null']
          properties:
            protocol: { type: string, example: TLSv1.3 }
            cipher: { type: string }
        end: { type: string, description: '"disconnect", "lost connection after DATA", "timeout after RCPT", "incomplete" ...' }

    SmtpConnection:
      allOf:
        - $ref: '#/components/schemas/SmtpSession'
        - type: object
          properties:
            tls_ms: { type: [integer, 'null'], description: 'ms after connect until TLS was established' }
            commands: { type: [string, 'null'], description: 'Postfix command statistics, e.g. "ehlo=1 starttls=1 commands=2"' }
            warnings: { type: array, items: { type: string }, example: ['non-SMTP command'] }

    SmtpAttempt:
      allOf:
        - $ref: '#/components/schemas/SmtpSession'
        - type: object
          properties:
            attempt: { type: integer, description: 'number of the transaction within the session' }
            mail_from: { type: [string, 'null'], description: 'empty string for bounces, null if unknown' }
            queue_id: { type: [string, 'null'] }
            recipients:
              type: array
              items:
                type: object
                properties:
                  rcpt: { type: string }
                  status: { type: string, enum: [accepted, rejected, tempfail] }
                  reply: { type: [string, 'null'], example: '550 5.1.1 <x@example.org>: Recipient address rejected: User unknown' }
            result:
              type: object
              properties:
                status: { type: string, enum: [accepted, rejected, tempfail, aborted, none], description: 'accepted = stored (250); none = no data for these recipients' }
                reply: { type: [string, 'null'] }
            message_ids: { type: array, items: { type: string }, description: 'messages of this project created by the attempt' }
            timing:
              type: [object, 'null']
              description: 'ms after connect (null if the step did not happen); wait_ms = reply_ms - data_end_ms'
              properties:
                tls_ms: { type: [integer, 'null'] }
                mail_from_ms: { type: [integer, 'null'] }
                data_end_ms: { type: [integer, 'null'], description: 'all data received' }
                reply_ms: { type: [integer, 'null'], description: 'reply to the data sent (250 / 4xx / 5xx)' }
                wait_ms: { type: [integer, 'null'], description: 'sender waited for the reply: store + analysis' }
